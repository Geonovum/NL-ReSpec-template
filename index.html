<!DOCTYPE html>
<html lang="nl">
<head>
  <meta content="text/html; charset=utf-8" http-equiv="content-type">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Hier wordt het favicon gezet -->
  <link rel="shortcut icon" type="image/x-icon" href="https://docs.geostandaarden.nl/media/Geonovum.ico" />
  
  <!-- De volgende regel zorgt ervoor dat plaatjes uit Imvertor niet geschaald
       worden, zodat de imagemap die op deze plaatjes zit werkt. 
       +Fix (temporary) for mermaid@1.3.0 giving zero width/height images

       Verplaatsen naar base.css op tools? Deze wordt geinclude via nl_organisationStylesURL in geonovum-config.mjs.
  -->
  <style>
    figure pre img.mermaid {min-width: 200px;}

    img.magnify.magnified {
      cursor: zoom-out;
      transform: scale(1.5);
      max-width: none;
    }
    img.magnify {
      cursor: zoom-in;
      transform: scale(1);
    }
    a.clickable {
      border-bottom: none;
    }
    
    @media print {    
      .leaflet-control-container, .leaflet-control-container * {
        display: none !important;
      }
      .leaflet-container {
        border: none;
      }
      a.clickable {
        pointer-events: none;
        cursor: default;
        text-decoration: none; /* Optional: removes underlines in print */
        color: inherit;         /* Optional: keeps text color normal */
      }
    }
  </style>

  <!-- color-scheme logius template verwacht https://tools.geostandaarden.nl/respec/style/dark.css -->
  <!--meta name="color-scheme" content="light dark"-->

  <!-- vanuit config/geonovum-config.mjs -->
  <script src="https://cdn.jsdelivr.net/gh/digitalbazaar/respec-mermaid@1.3.0/dist/main.js" class="remove"></script>
  <!-- script src="https://cdn.jsdelivr.net/gh/w3c/respec-mermaid@1.2.0/dist/main.js" class="remove"></script -->

  <!-- <script class="remove" type="module" src="js/config.mjs"></script> -->

  <script src="https://tools.geostandaarden.nl/respec/config/geonovum-config.js" class="remove"></script>
  <script src="js/config.js" class="remove"></script>
  <!-- TODO: Vul in config.js de titel in -->
  <script class="remove">
    const mergedLocalBiblio = {...organisationConfig.localBiblio, ...respecConfig.localBiblio};
    const mergedPostProcess = [...(organisationConfig.postProcess ?? []),...(respecConfig.postProcess ?? [])];
    respecConfig = {...organisationConfig, ...respecConfig, 
      postProcess: mergedPostProcess, 
      localBiblio: mergedLocalBiblio};
    document.title = respecConfig.title;
  </script>
  <!-- respec-code van Logius -->
  <script src="https://gitdocumentatie.logius.nl/publicatie/respec/builds/respec-nlgov.js" class="remove" async></script>

 	<!-- modeldesk react -->
	<script src="js/modeldesk-online.js" defer></script>
</head>

<body>
